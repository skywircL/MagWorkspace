# Opt in with: docker compose -f compose.yaml -f compose.observability.yaml --profile app --profile observability up -d --build
services:
  backend:
    environment:
      METRICS_ADDR: 0.0.0.0:9091
      TRACING_ENABLED: 'true'
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
    ports:
      - "127.0.0.1:${METRICS_PORT:-19091}:9091"
  jaeger:
    profiles: [observability]
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.22.0
    ports:
      - "127.0.0.1:${JAEGER_PORT:-16686}:16686"
      - "127.0.0.1:${OTLP_HTTP_PORT:-4318}:4318"
    mem_limit: 512m
    restart: unless-stopped
  prometheus:
    profiles: [observability]
    image: prom/prometheus:v3.13.4
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=512MB
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-19090}:9090"
    mem_limit: 512m
    restart: unless-stopped
volumes:
  prometheus-data:
