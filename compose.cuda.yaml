# Opt in only on a Linux Docker host with NVIDIA Container Toolkit.
# docker compose -f compose.yaml -f compose.cuda.yaml --profile app up -d --build
services:
  reranker:
    build:
      args:
        TORCH_INDEX_URL: ${RERANK_TORCH_INDEX_URL:-https://download.pytorch.org/whl/cu126}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${RERANK_CUDA_DEVICE_ID:-0}"]
              capabilities: [gpu]
